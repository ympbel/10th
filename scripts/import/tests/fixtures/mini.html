<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>mini</title></head><body>
<!-- Invented 3x4 sheet in the shape of a Google Sheets HTML export.
     Includes the frozen-row and frozen-column "freezebar" cells that real exports emit. -->
<div class="ritz grid-container" dir="ltr"><table class="waffle" cellspacing="0" cellpadding="0">
<thead><tr><th class="row-header freezebar-vertical-handle"></th><th id="0C0" style="width:100px;" class="column-headers-background">A</th><th id="0C1" style="width:100px;" class="column-headers-background">B</th><th class="freezebar-cell frozen-column-cell freezebar-vertical-handle"></th><th id="0C2" style="width:100px;" class="column-headers-background">C</th><th id="0C3" style="width:100px;" class="column-headers-background">D</th></tr></thead>
<tbody>
<tr><th class="freezebar-cell freezebar-horizontal-handle"></th><td class="freezebar-cell"></td><td class="freezebar-cell"></td><td class="freezebar-cell"></td><td class="freezebar-cell"></td><td class="freezebar-cell"></td></tr>
<tr style="height: 20px"><th id="0R0" style="height: 20px;" class="row-headers-background"><div class="row-header-wrapper" style="line-height: 20px">1</div></th><td class="s0">1</td><td class="s1">a</td><td class="freezebar-cell"></td><td class="s1">  b  </td><td class="s1">c</td></tr>
<tr style="height: 20px"><th id="0R1" style="height: 20px;" class="row-headers-background"><div class="row-header-wrapper" style="line-height: 20px">2</div></th><td class="s0">2</td><td class="s1">p</td><td class="freezebar-cell"></td><td class="s2" colspan="2">x &amp; <span style="font-weight:bold;">y</span></td></tr>
<tr style="height: 20px"><th id="0R2" style="height: 20px;" class="row-headers-background"><div class="row-header-wrapper" style="line-height: 20px">3</div></th><td class="s0">3</td><td class="s5 softmerge"><div class="softmerge-inner" style="width:197px;left:-1px">long note</div></td><td class="freezebar-cell"></td><td class="s1"></td><td class="s1">e<br>f</td></tr>
</tbody></table></div>
</body></html>
